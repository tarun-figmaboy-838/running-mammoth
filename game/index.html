<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ice Age Mammoth Runner</title>
<meta name="description" content="A 2D Ice Age runner where geometry repairs the broken ice path." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/screens.css" />
<!-- THE PRESSED BUTTON ART, FETCHED UP FRONT.

     For both picture buttons the press IS a different image, and a background-image
     that no rule has yet applied is not requested until the moment it is needed. So
     the very first tap of PLAY, and the first tap of JUMP, swapped to an image that
     had not arrived — the button went blank for as long as the fetch took, which on a
     phone is exactly the tap where the player is deciding whether the game responds at
     all. Preloading is 100kB and removes the flash entirely. -->
<link rel="preload" as="image" href="assets/ui/btn-play-pressed.webp" />
<link rel="preload" as="image" href="assets/ui/btn-pressed.webp" />
<!-- Try Again is on a card that appears the instant the player fails, so its art has to
     already be in hand: there is no moment to fetch it in. -->
<link rel="preload" as="image" href="assets/ui/btn-tryagain.webp" />
</head>
<body>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="game-canvas" aria-label="Ice Age mammoth runner game"></canvas>

      <div class="hud">
        <!-- The hint / sound / pause cluster that used to sit top-right has been
             removed on request. Nothing replaces it: the stage is now entirely
             gameplay apart from the instruction card and the jump button.

             What went with it, so it is on the record: there is no in-game mute, no
             pause, and no way to bring the instruction back. Sound and motion can
             still be set from the URL (?sound=0, ?reduced=1) and the pause panel below
             is still wired, but nothing opens it any more. -->

        <!-- how far through the six repairs: diamonds only, no captions -->

        <div class="instruction" id="instruction" hidden>
          <div class="instruction-pill" id="instruction-pill">
            <!-- The sentence, and only the sentence. It used to be paired with a
                 drawn polygon; that was removed on request, so the words carry the
                 whole instruction and are set large enough to be the thing you look
                 at. Still the only learner-facing text in a phase. -->
            <span class="instruction-text" id="instruction-text" aria-live="polite"></span>
          </div>
        </div>

        <button class="btn-jump" id="btn-jump" type="button" aria-label="Jump" hidden>
          <span class="btn-jump-face"><span class="btn-jump-label">JUMP</span></span>
        </button>

        <!-- a brief mark over the crossing: cause and effect, without a modal -->
        <div class="verdict" id="verdict" aria-hidden="true" hidden></div>

        <!-- shown only after a long idle: demonstrates the cut, never performs it -->
        <div class="hand-hint" id="hand-hint" aria-hidden="true" hidden></div>

        <div class="overlay pause-panel" id="paused" hidden>
          <div class="card">
            <h1>Paused</h1>
            <div class="pause-row">
              <button class="icon-btn" id="btn-restart" type="button" aria-label="Start over" data-icon="restart">
                <span class="icon-btn-face"></span><span class="icon-btn-glyph"></span>
              </button>
              <button class="icon-btn" id="btn-sound2" type="button" aria-label="Sound" aria-pressed="true" data-icon="sound-on">
                <span class="icon-btn-face"></span><span class="icon-btn-glyph"></span>
              </button>
            </div>
            <button class="btn-chunky btn-resume" id="btn-resume" type="button">
              <span class="btn-chunky-face"><span class="btn-chunky-label">Resume</span></span>
            </button>
          </div>
        </div>

        <!-- The Ouch card. `card-fun` opts it into the cartoon treatment in
             screens.css: a warm rounded panel that bounces in, rather than the flat ice
             slab the overlays used to share. TRY AGAIN is the supplied art and so is a
             .btn-art like PLAY and JUMP; it came as a single take with no pressed
             version, so its press is a darkening and a squash in CSS. -->
        <div class="overlay" id="oops" hidden>
          <div class="card card-fun">
            <div class="card-hero" id="oops-hero" aria-hidden="true"></div>
            <h1>Ouch!</h1>
            <!-- No inner span: it held the sheen layer, which is gone (see the note in
                 screens.css). The supplied art carries its own gloss. -->
            <button class="btn-art btn-retry" id="btn-retry" type="button" aria-label="Try again"></button>
          </div>
        </div>

        <div class="overlay" id="complete" hidden>
          <div class="card">
            <h1>Journey Complete</h1>
            <p>Seven crossings repaired. The mammoth made it to nightfall.</p>
            <button class="btn-primary" id="btn-replay" type="button"><span class="btn-primary-face">Replay</span></button>
          </div>
        </div>

        <div class="overlay rotate" id="rotate" hidden>
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <rect x="15" y="6" width="18" height="30" rx="3.5" stroke="#A9E7FA" stroke-width="2.6" />
            <path d="M10 40 A16 16 0 0 0 38 40" stroke="#A9E7FA" stroke-width="2.6" stroke-linecap="round" />
            <path d="M34 36 L38 40 L34 44" stroke="#A9E7FA" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <p>Rotate your device</p>
        </div>

        <!-- Cover: the supplied FROZEN RUSH banner, with drifting snow and a PLAY button -->
        <div class="screen cover" id="cover" hidden>
          <div class="cover-art" aria-hidden="true"></div>
          <div class="cover-snow" aria-hidden="true"></div>
          <!-- NOT a .btn-chunky. It used to carry that class to inherit the button
               family's rim and gloss, and then override all of it — but the family's
               HOVER rule (`.btn-chunky:hover`, specificity 0-2-0) outranks a plain
               `.btn-play` (0-1-0), so on hover the family's navy keyline came back and,
               with the radius zeroed for the art, drew a hard RECTANGLE around the
               button. Overriding state by state is whack-a-mole; the fix is that the
               picture buttons are their own family. -->
          <button class="btn-art btn-play" id="btn-play" type="button" aria-label="Play"></button>
        </div>

      </div>
    </div>
  </div>

  <!-- HOW THE CODE IS LOADED, and why it is not just one script tag.

       The game is written as ES modules, and a browser fetches a module with CORS even
       from a file:// page — which file:// refuses outright:

         Access to script at 'file:///.../js/main.js' from origin 'null' has been
         blocked by CORS policy: Cross origin requests are only supported for protocol
         schemes: chrome, chrome-untrusted, data, http, https.

       So opening this file by double-clicking it used to give a permanently blank dark
       stage, with the real reason only visible in the console. A classic <script> has
       no such restriction, so off the disk we load the concatenated build instead.

       Over http:// nothing changes: the modules are loaded, exactly as before, so the
       files in js/ stay the source of truth and editing them takes effect immediately.
       The bundle is a build artefact (tools/build-bundle.mjs) and a test fails if it
       has drifted from the modules, so the two can never silently disagree.

       `nomodule` is not the mechanism here — that targets browsers WITHOUT module
       support, which is a different question from the page's origin. -->
  <script>
    (function () {
      var s = document.createElement('script');
      if (location.protocol === 'file:') {
        s.src = 'js/game.bundle.js';
      } else {
        s.type = 'module';
        s.src = 'js/main.js';
      }
      document.head.appendChild(s);
    })();
  </script>
  <!-- POSITIONED, or nobody reads it. This paragraph used to sit in normal flow after
       a .stage-wrap with `min-height: 100vh`, inside a body with `overflow: hidden` —
       so it was laid out below the fold of a document that cannot scroll. A visitor
       with JavaScript off saw a blank dark stage and no explanation at all. Fixed and
       centred, it is the only thing on the page. -->
  <noscript>
    <div style="position:fixed;inset:0;z-index:99;display:flex;align-items:center;
                justify-content:center;background:#061a38;padding:24px">
      <p style="color:#EAF9FF;font:600 18px/1.5 system-ui,sans-serif;text-align:center;margin:0">
        This game needs JavaScript enabled.
      </p>
    </div>
  </noscript>
</body>
</html>
