<!DOCTYPE html><html><head><meta charset="utf-8"><base href="/"><title>QA shot</title>
<style>html,body{margin:0;background:#001a33}canvas{width:100vw;height:auto;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
let vnow = 0; const q = [];
window.requestAnimationFrame = fn => { q.push(fn); return q.length; };
window.cancelAnimationFrame = () => {};
performance.now = () => vnow;
window.__step = () => { vnow += 16; const b = q.splice(0, q.length); for (const f of b) { try { f(vnow); } catch (e) { window.__err(e); } } };
</script>
<script type="module">
import { createGame, CFG } from '/js/engine.js';
const errs = [];
window.__err = e => errs.push(String(e && e.stack ? e.stack.split('\n')[0] : e));
window.onerror = m => errs.push('ERR ' + m);
const P = new URLSearchParams(location.search);
const want = P.get('at') || 'active';
const phase = Number(P.get('phase') || 2);
const game = createGame(document.getElementById('c'), { onReady: () => Promise.resolve().then(run), onHud: () => {} });
async function run() {
  await new Promise(r => setTimeout(r, 300));
  game.setOptions({ sound: false, speed: 900 });
  game.begin();
  const G = game.debug();
  G.phase = phase;
  let hold = -1, cut = false;
  for (let i = 0; i < 40000; i++) {
    window.__step();
    const s = G.state;
    for (const o of game._obstacles().list) {
      const sx = o.x - G.worldX;
      if (sx > 400 && sx < 700 && !o.passed) game.jump();
    }
    if (s === 'OBSTACLE_HIT') game.retryObstacle();
    if (/RUN|POST_JUMP/.test(s)) game._skipTo(120);
    if (want === 'active' && s === 'PHASE_ACTIVE' && hold < 0) hold = i + 60;
    if (want === 'cut') {
      if (s === 'PHASE_ACTIVE' && !cut && G.l1) {
        const t = G.l1.targets.find(x => !x.filled);
        if (t) { cut = game._cut(t.kind); if (cut) hold = i + 9; }
      }
    }
    if (want === 'filled') {
      if (s === 'PHASE_ACTIVE' && !cut && G.l1) {
        const t = G.l1.targets.find(x => !x.filled);
        if (t) cut = game._cut(t.kind);
      }
      if (G.gapsThisPhase && G.gapsThisPhase.every(g => g.repaired && g.bridge >= 1) && hold < 0) hold = i + 20;
    }
    if (hold >= 0 && i >= hold) break;
  }
  document.title = 'DONE ' + G.state + ' err=' + errs.length + (errs.length ? ' :: ' + errs[0] : '');
}
</script></body></html>
